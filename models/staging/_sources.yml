version: 2

sources:
  - name: shop
    description: "Rohdaten des Onlineshops NordLicht Wohnen, per COPY INTO geladen (insert-only)."
    database: raw
    schema: shop
    tables:
      - name: kunden
        description: "Kundenstammdaten. Jede Ladung bringt neue oder geänderte Kunden."
        columns:
          - name: kunden_nr
            description: "Business Key des Kunden, z. B. K00001"
            data_tests:
              - not_null
      - name: produkte
        description: "Produktkatalog mit Listenpreis."
      - name: bestellungen
        description: "Bestellköpfe. Statusänderungen kommen als neue Zeile in einer späteren Ladung."
      - name: bestellpositionen
        description: "Positionen je Bestellung (Bestellung x Produkt)."
